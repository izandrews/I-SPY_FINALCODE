<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width" />
		<!--<link rel="icon" href={`${BASE}title.webp`} /> -->
		<title>i-spy</title>
        <link
        rel="stylesheet"
        type="text/css"
        href="ispy_css.css"
        />
        <script src="ispy_java.js" defer></script>
	</head>
	<body>
        <h2 id="title">I-SPY</h2>
        <div class="content">
            <div class="map">
                <div class="stairs">
                    <img src="./stairs4.svg" class="stair-SVG" />
                </div>
                <div class="person">
                    <img src="./person.svg" class="person-SVG" />
                </div>
                    <div id="mic1">
                        
                    </div>
                    <div id="mic2">
                        
                    </div>
                    <div id="mic3">
                        
                    </div>
                    <div id="mic4">
                        
                    </div>

                    <div id="mic5">
                        
                    </div>
            </div>
             <p class="channel-text">
                <span class="nomic-selected">No channel selected ...</span>
                <span class="mic1-selected">mic1 selected!</span>
                <span class="mic2-selected">mic2 selected!</span>
                <span class="mic3-selected">mic3 selected!</span>
                <span class="mic4-selected">mic4 selected!</span>
                <span class="mic5-selected">mic5 selected!</span>
             </p>


            <div class="text-box">
                <div class="text-stream">
                    <div class="no-ts"> no text...</div>
                    <div class="mic1-ts"></div>
                    <div class="mic2-ts"> no conversation detected ....</div>
                    <div class="mic3-ts"> no conversation detected ....</div>
                    <div class="mic4-ts"> no conversation detected ....</div>
                    <div class="mic5-ts"> no conversation detected ....</div>
                </div>
            </div>
            
            <div class="waves">
                <canvas id="wave-drawing" width="400" height="200" style="border:5px solid red;"></canvas>

            </div>

            
        </div> <!-- CONTENT DIV -->
 
       
  	</body>
</html>
